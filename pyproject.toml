[project]
name = "arranger"
version = "0.1.0"
description = "Extract a per-bar arrangement draft (tempo, meter, key, chords, dynamics, sections, lyrics) from an audio file"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.0.1",
    "beat-this>=1.1",
    "faster-whisper>=1.1",
    "av>=13",
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.scripts]
arrange = "arranger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arranger"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real models on synthesized audio"]
